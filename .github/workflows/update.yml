name: Update Garmin Dashboard

on:
  schedule:
    # Twice daily. Cron is in UTC; times below are Pacific.
    # Minute 17 (not :00) avoids GitHub's top-of-hour congestion, which can delay runs.
    - cron: '17 14 * * *'   # ~7:17am PDT (6:17am PST after Nov 1): captures overnight sleep/HRV/readiness
    - cron: '17 2 * * *'    # ~7:17pm PDT (6:17pm PST after Nov 1): captures the day's run
  workflow_dispatch:        # manual "Run workflow" button still works

permissions:
  contents: write

# Prevents a manual run and a scheduled run from overlapping and colliding on git push.
concurrency:
  group: garmin-dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull in any browser-saved edits
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # v16: checkboxes/notes/drag-and-drop swaps commit straight to
          # manual_data.json via the GitHub API, independently of this
          # workflow — pull that in BEFORE the script below writes anything,
          # while the tree is still clean. A pull --rebase refuses to run once
          # there are local uncommitted changes, which the script is about to
          # create (that's the exact "cannot pull with rebase: you have
          # unstaged changes" error from before — it happened because this
          # pull used to run after the script, against a dirty tree). Doing it
          # here also means today's build of index.html already reflects any
          # edit saved since the last sync, instead of waiting for the next one.
          git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install garminconnect "gspread>=6"
      - name: Run update script
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}     # optional (v10)
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}   # Google Sheets export; export skips if unset
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DASHBOARD_EDIT_TOKEN: ${{ secrets.DASHBOARD_EDIT_TOKEN }}
        run: python update_dashboard.py
      - name: Commit updated dashboard
        run: |
          git add index.html
          git commit -m "Auto-update dashboard" || echo "No changes to commit"
          # A second pull --rebase here is safe now (index.html is already
          # committed, so the tree is clean again) — it catches anything that
          # landed on origin while the script above was busy calling the
          # Garmin and Google Sheets APIs, and replays this commit on top of
          # it instead of letting the push get rejected or racing it.
          git pull --rebase origin main
          git push
